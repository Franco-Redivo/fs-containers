services:
  frontend:
    image: todo-frontend-dev
    build:
      context: ./todo-frontend
      dockerfile: dev.Dockerfile
    environment:
      VITE_BACKEND_URL: /api
    volumes:
      - ./todo-frontend:/usr/src/app
      - /usr/src/app/node_modules
    container_name: todo-proxy-front-dev

  backend:
    image: todo-backend-dev
    build:
      context: ./todo-backend
      dockerfile: dev.Dockerfile
    environment:
      MONGO_URL: mongodb://root:example@mongo:27017/the_database?authSource=admin
      REDIS_URL: redis://redis:6379
    volumes:
      - ./todo-backend:/usr/src/app
      - /usr/src/app/node_modules
    container_name: todo-proxy-backend-dev
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - todo_mongo_data:/data/db

  redis:
    image: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - todo_redis_data:/data

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    container_name: todo-proxy-nginx-dev
    depends_on:
      - frontend
      - backend

volumes:
  todo_mongo_data: {}
  todo_redis_data: {}
